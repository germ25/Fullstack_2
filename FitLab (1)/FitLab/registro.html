<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="img/favicon.jpeg">
    <title>Registro - FitLab</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


    <header class="encabezado">

        <div class="contenedor encabezado-interno">

            <a href="index.html" class="logo">
                🏋️ FitLab
            </a>


            <nav class="nav-principal">

                <ul>

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="productos.html">Productos</a>
                    </li>

                    <li>
                        <a href="contacto.html">Contacto</a>
                    </li>

                </ul>

            </nav>


        </div>

    </header>




    <main class="contenedor pagina">


        <section class="tarjeta-admin">


            <h1>Registrarse</h1>


            <form id="form-registro" novalidate>



                <div class="grupo-formulario">

                    <label for="nombre">
                        Nombre completo
                    </label>


                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez">


                    <span class="mensaje-error" id="error-nombre"></span>


                </div>




                <div class="grupo-formulario">


                    <label for="correo">
                        Correo electrónico
                    </label>


                    <input type="email" id="correo" placeholder="correo@ejemplo.com">


                    <span class="mensaje-error" id="error-correo"></span>


                </div>





                <div class="grupo-formulario">


                    <label for="password">
                        Contraseña
                    </label>


                    <input type="password" id="password" placeholder="********">


                    <span class="mensaje-error" id="error-password"></span>


                </div>





                <button type="submit" class="boton boton-primario">

                    Crear cuenta

                </button>




                <p>

                    ¿Ya tienes una cuenta?

                    <a href="login.html">
                        Iniciar sesión
                    </a>

                </p>




            </form>


        </section>


    </main>





    <footer class="pie-pagina">


        <div class="contenedor">

            <p>
                FitLab 2026. Todos los derechos reservados
            </p>

        </div>


    </footer>





    <script src="js/registro.js"></script>


</body>

</html>
